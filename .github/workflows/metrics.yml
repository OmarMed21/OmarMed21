name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 1. 3D CONTRIBUTION GRAPH
      # ============================================================

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: OmarMed21
          MAX_REPOS: 300


      # ============================================================
      # 2. ISOMETRIC CONTRIBUTION CALENDAR
      #
      # output_action: none
      # means Lowlighter DOES NOT commit anything itself.
      # We commit everything once at the very end.
      # ============================================================

      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-isocalendar.svg
          output_action: none

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          repositories: 300
          repositories_batch: 50
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      # ============================================================
      # 3. CODE ACTIVITY / LINES CHANGED
      # ============================================================

      - name: Generate code activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-lines.svg
          output_action: none

          base: ""

          plugin_lines: yes
          plugin_lines_delay: 30

          repositories: 300
          repositories_batch: 50
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      # ============================================================
      # COPY LOWLIGHTER OUTPUTS INTO REPOSITORY
      # ============================================================

      - name: Copy generated metrics
        run: |
          mkdir -p assets

          sudo cp /metrics_renders/metrics-isocalendar.svg assets/metrics-isocalendar.svg
          sudo cp /metrics_renders/metrics-lines.svg assets/metrics-lines.svg

          sudo chown -R "$USER":"$USER" assets


      # ============================================================
      # CHECK GENERATED FILES
      # ============================================================

      - name: Verify generated files
        run: |
          echo "Checking generated files..."

          test -f profile-3d-contrib/profile-night-rainbow.svg
          test -f assets/metrics-isocalendar.svg
          test -f assets/metrics-lines.svg

          echo ""
          echo "SUCCESS:"
          echo "profile-3d-contrib/profile-night-rainbow.svg"
          echo "assets/metrics-isocalendar.svg"
          echo "assets/metrics-lines.svg"


      # ============================================================
      # ONE SINGLE COMMIT
      # ============================================================

      - name: Commit and push generated gadgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/
          git add assets/

          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile gadgets [skip ci]"
          git push
