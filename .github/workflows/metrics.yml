name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "15 2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. MAIN OVERVIEW
      # Public + Private + Organization repositories
      # =====================================================

      - name: Generate GitHub overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-overview.svg

          template: classic

          base: header, activity, community, repositories
          base_indepth: yes

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      # =====================================================
      # 2. 3D / ISOMETRIC CONTRIBUTION CALENDAR
      # =====================================================

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-calendar.svg

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      # =====================================================
      # 3. LANGUAGES
      # Looks through repos you contribute to
      # =====================================================

      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-languages.svg

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      # =====================================================
      # 4. CODING HABITS / ACTIVITY
      # =====================================================

      - name: Generate coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: metrics-habits.svg

          template: classic
          base: ""

          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin
