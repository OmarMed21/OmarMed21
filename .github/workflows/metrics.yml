name: Update GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # OVERVIEW
      # =========================================================
      - name: GitHub Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: OmarMed21
          filename: metrics-overview.svg
          output_action: commit

          template: classic

          base: header, activity, community, repositories
          base_indepth: yes

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no
          retries: 2
          retries_delay: 30


      # =========================================================
      # ISOMETRIC CONTRIBUTION CALENDAR
      # =========================================================
      - name: Contribution Calendar
        if: ${{ success() || failure() }}

        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: OmarMed21
          filename: metrics-calendar.svg
          output_action: commit

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no
          retries: 2
          retries_delay: 30


      # =========================================================
      # LANGUAGES
      # =========================================================
      - name: Languages
        if: ${{ success() || failure() }}

        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: OmarMed21
          filename: metrics-languages.svg
          output_action: commit

          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_categories: programming, markup

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no
          retries: 2
          retries_delay: 30


      # =========================================================
      # CODING HABITS
      # =========================================================
      - name: Coding Habits
        if: ${{ success() || failure() }}

        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: OmarMed21
          filename: metrics-habits.svg
          output_action: commit

          base: ""

          plugin_habits: yes
          plugin_habits_from: 300
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no
          retries: 2
          retries_delay: 30
