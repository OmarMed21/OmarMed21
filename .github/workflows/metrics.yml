
name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

jobs:

  profile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 3D CONTRIBUTION CITY
      # Includes private contribution data available to your token
      # ============================================================

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          USERNAME: OmarMed21
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          MAX_REPOS: 300


      # ============================================================
      # CODING HABITS
      # ============================================================

      - name: Generate Coding Habits
        uses: lowlighter/metrics@latest
        with:

          user: OmarMed21

          token: ${{ secrets.METRICS_TOKEN }}

          committer_token: ${{ secrets.GITHUB_TOKEN }}

          filename: metrics-habits.svg

          output_action: commit

          base: ""

          plugin_habits: yes

          plugin_habits_from: 500

          plugin_habits_days: 30

          plugin_habits_facts: yes

          plugin_habits_charts: yes

          plugin_habits_trim: yes

          repositories: 300

          repositories_affiliations: >
            owner,
            collaborator,
            organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no


      # ============================================================
      # RECENT ACTIVITY
      # ============================================================

      - name: Generate Recent Activity
        if: ${{ success() || failure() }}

        uses: lowlighter/metrics@latest

        with:

          user: OmarMed21

          token: ${{ secrets.METRICS_TOKEN }}

          committer_token: ${{ secrets.GITHUB_TOKEN }}

          filename: metrics-activity.svg

          output_action: commit

          base: ""

          plugin_activity: yes

          plugin_activity_limit: 8

          plugin_activity_days: 30

          plugin_activity_visibility: all

          plugin_activity_timestamps: yes

          repositories: 300

          repositories_affiliations: >
            owner,
            collaborator,
            organization_member

          config_timezone: Europe/Berlin

          plugins_errors_fatal: no


      # ============================================================
      # COMMIT 3D FILES
      # ============================================================

      - name: Commit 3D Graph
        if: ${{ success() || failure() }}

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase || true

          git add profile-3d-contrib/ || true

          if git diff --cached --quiet; then

            echo "No 3D changes"

          else

            git commit -m "chore: update 3D contribution graph"

            git push

          fi


