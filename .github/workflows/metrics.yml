name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # GITHUB OVERVIEW
      #
      # Uses your PAT so private/collaborator/org repositories
      # accessible by that PAT are included in the calculations.
      # ============================================================

      - name: Generate GitHub overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: github-overview.svg
          output_action: none

          template: classic

          base: header, activity, community, repositories
          base_indepth: yes

          repositories: 200
          repositories_batch: 25
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      - name: Save GitHub overview
        run: |
          mkdir -p assets
          sudo cp /metrics_renders/github-overview.svg assets/github-overview.svg
          sudo chown "$USER":"$USER" assets/github-overview.svg

          test -s assets/github-overview.svg

          echo "GitHub overview generated."


      # ============================================================
      # ISOMETRIC CONTRIBUTION CALENDAR
      # ============================================================

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: OmarMed21

          filename: github-calendar.svg
          output_action: none

          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          repositories: 200
          repositories_batch: 25
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: Europe/Berlin


      - name: Save contribution calendar
        run: |
          mkdir -p assets
          sudo cp /metrics_renders/github-calendar.svg assets/github-calendar.svg
          sudo chown "$USER":"$USER" assets/github-calendar.svg

          test -s assets/github-calendar.svg

          echo "Contribution calendar generated."


      # ============================================================
      # 3D CONTRIBUTION GRAPH
      # ============================================================

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: OmarMed21
          MAX_REPOS: 200


      # ============================================================
      # VERIFY EVERYTHING BEFORE PUSHING
      # ============================================================

      - name: Verify gadgets
        run: |
          echo "Checking generated files..."

          test -s assets/github-overview.svg
          test -s assets/github-calendar.svg
          test -s profile-3d-contrib/profile-night-rainbow.svg

          echo ""
          echo "All profile gadgets generated correctly:"
          echo "✓ assets/github-overview.svg"
          echo "✓ assets/github-calendar.svg"
          echo "✓ profile-3d-contrib/profile-night-rainbow.svg"


      # ============================================================
      # COMMIT EVERYTHING ONCE
      # ============================================================

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/
          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi

          git commit -m "chore: update GitHub profile data [skip ci]"
          git push
